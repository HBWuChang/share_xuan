name: iOS CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test transfer core
        run: swift test --package-path TransferCore
      - name: Build app and share extension
        run: >-
          xcodebuild -project share_xuan.xcodeproj -scheme share_xuan
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Validate release scripts
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
