name: TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  release:
    # A public-repo PR or arbitrary branch must never receive signing credentials.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test
        run: |
          xcodebuild -version
          swift test --package-path TransferCore
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Install and validate signing credentials
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          DISTRIBUTION_P12_BASE64: ${{ secrets.DISTRIBUTION_P12_BASE64 }}
          DISTRIBUTION_P12_PASSWORD: ${{ secrets.DISTRIBUTION_P12_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.APP_PROFILE_BASE64 }}
          SHARE_PROFILE_BASE64: ${{ secrets.SHARE_PROFILE_BASE64 }}
        run: python3 scripts/ci/signing.py prepare
      - name: Archive and export
        shell: bash
        run: |
          set -euo pipefail
          # Respect CFBundleVersion component widths (4, 2, 2 digits).
          (( GITHUB_RUN_NUMBER <= 999899 && GITHUB_RUN_ATTEMPT <= 99 ))
          BUILD_NUMBER="$((GITHUB_RUN_NUMBER / 100 + 1)).$((GITHUB_RUN_NUMBER % 100)).${GITHUB_RUN_ATTEMPT}"
          echo "Build number: $BUILD_NUMBER"
          xcodebuild -project share_xuan.xcodeproj -scheme share_xuan \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/share_xuan.xcarchive" \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/share_xuan.xcarchive" \
            -exportPath "$RUNNER_TEMP/share-xuan-export" \
            -exportOptionsPlist "$RUNNER_TEMP/share-xuan-signing/ExportOptions.plist"
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/share-xuan-signing/private_keys"
          IPA="$RUNNER_TEMP/share-xuan-export/share_xuan.ipa"
          test -f "$IPA"
          xcrun altool --validate-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo '### Upload accepted' >> "$GITHUB_STEP_SUMMARY"
          echo 'Check App Store Connect → TestFlight for processing, export compliance and tester distribution. This workflow does not submit external beta review.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing credentials
        if: always()
        run: python3 scripts/ci/signing.py cleanup
